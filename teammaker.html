<!DOCTYPE html>
<html lang ="es">
    <head>
        <meta charset="UTF-8">
        <title>Equipo</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/teammaker.css">
    </head>
    <body>
        <header class="header">
          <h1 class="logo">PokéCalc</h1>
          <nav class="nav">
            <a href="index.html">Inicio</a>
            <a href="team.html">Equipo</a>
            <a>Calcular</a>
          </nav>
        </header>

        <div class="split-container">
    
            <div class="panel left-side">
                <h2>Equipo</h2>
                        
                <div class="team" id="team"></div>
            </div>

            <div class="panel right-side">
                <div class="search">
                    <div class="bar">
                        <input type="text" id="inputBox" placeholder="Selecciona al pokémon" autocomplete="off">
                        <button>Search</button>
                    </div>
                    <div class="resultBox"></div>
                </div>
                <div id="statsBox" class="statsBox"></div>
            </div>

        </div>
        
        <script type="text/javascript" src="pkmn.js"></script>
        <script type="text/javascript" src="equipo.js"></script>
        <script type="text/javascript" src="busqueda.js"></script>
<script>
// Select all the elements you want to be selectable
const boxes = document.querySelectorAll('.box');

boxes.forEach(box => {
  box.addEventListener('click', () => {
    // 1. Remove the 'active' class from whichever element currently has it
    document.querySelector('.box.active')?.classList.remove('active');
    
    // 2. Add the 'active' class to the element that was just clicked
    box.classList.add('active');
  });
});
</script>

    </body>
</html>
