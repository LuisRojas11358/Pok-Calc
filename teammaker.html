<!DOCTYPE html>
<html lang ="es">
    <head>
        <meta charset="UTF-8">
        <title>Equipo</title>
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="css/teammaker.css">
    </head>
    <body>
        <div class="split-container">
    
            <div class="panel left-side">
                <h2>Equipo</h2>
                        
                <div class="team" id="team"></div>
            </div>

            <div class="panel right-side">
                <div class="search">
                    <div class="bar">
                        <input type="text" id="inputBox" placeholder="Selecciona al pokémon" autocomplete="off">
                        <button>Search</button>
                    </div>
                    <div class="resultBox"></div>
                </div>
                <div id="statsBox" class="statsBox"></div>
            </div>

        </div>
        
        <script type="text/javascript" src="pkmn.js"></script>
        <script type="text/javascript" src="equipo.js"></script>
        <script type="text/javascript" src="busqueda.js"></script>
        

    </body>
</html>
