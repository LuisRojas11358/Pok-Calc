<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>PokéCalc</title>
        <style>
            body{
                background-color: #111111;
                color: darkgoldenrod
            }
            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                box-shadow: 0px 10px 20px black;
            }
            .nav a{
                margin: 0.5rem;
                transition: color 0.3s;
            }
            .grupo { 
                margin-bottom: 15px; 
            }
            label { 
                display: block; 
                margin-bottom: 5px; 
                font-size: 14px;
            }
            input { 
                width: 70%; 
                padding: 8px 0; 
                font-size: 14px; 
            }
            h2 { 
                margin-top: 0; 
                text-align: center; 
            }
            .centro {
                font-family: Arial, sans-serif;
                width: 100%;
                padding: 10% 0;
            }
            .mostrar { 
                width: max-content; 
                padding: 8px; 
                font-size: 14px; 
                cursor: pointer; 
            }
            .registro { 
                width: 100%; padding: 10px; 
                background-color: darkgoldenrod; 
                color: white; 
                border: none; 
                border-radius: 4px; 
                font-size: 16px; 
                cursor: pointer; }
            form {
                width: 320px;
                margin: 0 auto;
            }
        </style>
    </head>
    <body>
        <header class="header">
          <h1 class="logo">PokéCalc</h1>
          <nav class="nav">
            <a>Inicio</a>
            <a>Equipo</a>
            <a>Calcular</a>
          </nav>
        </header>

        <div class="centro">
        <h2>Registro</h2><br>
        <form id="formRegistro">
            <div class="grupo">
                <label for="usuario">Nombre de usuario:</label>
                <input type="text" id="usuario" required>
            </div>

            <div class="grupo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required>
                <button type="button" id="btnMostrar" class="mostrar">Mostrar</button>
            </div>

            <div class="grupo">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" required>
                <button type="button" id="btnMostrarConfirm" class="mostrar">Mostrar</button>
                <div id="mensajeError"></div>
            </div>

            <button type="submit" id="btnEnviar" class="registro" disabled>Registrarse</button>
        </form>
    </div>

    <script>
        const inputPass = document.getElementById("password");
        const inputConfirm = document.getElementById("confirmPassword");
        const mensajeError = document.getElementById("mensajeError");
        const btnEnviar = document.getElementById("btnEnviar");

        function validarContrasenas() {
            const pass = inputPass.value;
            const confirm = inputConfirm.value;

            // Si ambos campos están vacíos, limpiamos mensajes y desactivamos
            if (pass === "" && confirm === "") {
                mensajeError.textContent = "";
                btnEnviar.disabled = true;
                return;
            }

            // Validamos si coinciden
            if (pass === confirm) {
                mensajeError.textContent = "✔ Las contraseñas coinciden";
                mensajeError.style.color = "green";
                btnEnviar.disabled = false; // Habilitamos el botón
            } else {
                mensajeError.textContent = "✖ Las contraseñas no coinciden";
                mensajeError.style.color = "darkred";
                btnEnviar.disabled = true; // Deshabilitamos el botón
            }
        }

        // Escuchamos cuando el usuario escribe en cualquiera de los dos campos de contraseña
        inputPass.addEventListener("input", validarContrasenas);
        inputConfirm.addEventListener("input", validarContrasenas);

        // Opcional: simular el envío del formulario
        document.getElementById("formRegistro").addEventListener("submit", (e) => {
            e.preventDefault();
            window.location.href = "/index.html";
        });

        const btnMostrar = document.querySelectorAll("#btnMostrar");

        const btnMostrarPass = document.getElementById("btnMostrar");
        const btnMostrarConfirm = document.getElementById("btnMostrarConfirm");

        btnMostrarPass.addEventListener("click", () => {
            if (inputPass.type === "password") {
                inputPass.type = "text";
                btnMostrarPass.textContent = "Ocultar";
            } else {
                inputPass.type = "password";
                btnMostrarPass.textContent = "Mostrar";
            }
        });

        btnMostrarConfirm.addEventListener("click", () => {
            if (inputConfirm.type === "password") {
                inputConfirm.type = "text";
                btnMostrarConfirm.textContent = "Ocultar";
            } else {
                inputConfirm.type = "password";
                btnMostrarConfirm.textContent = "Mostrar";
            }
        });
    </script>
    </body>
</html>
